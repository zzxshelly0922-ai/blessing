<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給爸爸媽媽的祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: fadeIn 1.5s ease-in-out;
        }

        .date-box {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .day-box {
            font-size: 1.8rem;
            color: #ff6b6b;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .divider {
            height: 2px;
            background: #ffe3e3;
            width: 60px;
            margin: 0 auto 25px auto;
            border-radius: 2px;
        }

        .message {
            font-size: 1.6rem;
            color: #333;
            line-height: 1.6;
            font-weight: 600;
        }

        .heart {
            font-size: 2rem;
            margin-top: 20px;
            animation: pulse 1.2s infinite;
            display: inline-block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 自動顯示日期 -->
        <div class="date-box" id="currentDate">載入日期中...</div>
        <!-- 自動顯示星期 -->
        <div class="day-box" id="currentDay">載入星期中...</div>
        
        <div class="divider"></div>

        <!-- 祝福語 -->
        <div class="message">
            天天開心<br>我愛你喲 ❤️
        </div>

        <div class="heart">💖</div>
    </div>

    <script>
        // 自動取得並顯示今天的日期與星期（繁體中文格式）
        const optionsDate = { year: 'numeric', month: 'long', day: 'numeric' };
        const optionsDay = { weekday: 'long' };
        
        const today = new Date();
        
        document.getElementById('currentDate').innerText = today.toLocaleDateString('zh-TW', optionsDate);
        document.getElementById('currentDay').innerText = today.toLocaleDateString('zh-TW', optionsDay);
    </script>

</body>
</html>
